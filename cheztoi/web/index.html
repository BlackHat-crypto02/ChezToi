<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ChezToi : trouvez, visitez et réservez votre logement au Togo.">
  <meta name="theme-color" content="#0F766E">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cheztoi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ChezToi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#053B37">
  <style id="cheztoi-chargement">
    /* Écran d'attente du moteur Flutter, aux couleurs du démarrage animé. */
    #chargement {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: linear-gradient(#0A4F49, #053B37, #021E1C);
    }
    #chargement span {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255,255,255,.12); position: relative;
    }
    #chargement span::after {
      content: ""; position: absolute; inset: 0; width: 40%;
      background: #5EEAD4; animation: va 1.1s ease-in-out infinite;
    }
    @keyframes va { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
  </style>
  <div id="chargement" aria-label="Chargement de ChezToi"><span></span></div>
  <script>
    // Retire l'écran d'attente dès que Flutter dessine sa première image.
    window.addEventListener("flutter-first-frame", function () {
      var e = document.getElementById("chargement");
      if (e) e.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
